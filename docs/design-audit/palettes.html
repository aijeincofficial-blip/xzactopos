<!doctype html>
<meta charset="utf-8">
<style>
body{margin:0;padding:24px;font-family:Roboto,Segoe UI,sans-serif;background:#d9dde3;display:flex;gap:20px;flex-wrap:wrap;width:1500px}
h2{margin:0 0 8px;font-size:18px}
.col{width:340px}
.phone{width:340px;height:620px;border-radius:26px;overflow:hidden;position:relative;box-shadow:0 4px 18px #0003;background:var(--bg);color:var(--text)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 8px;font-weight:600;font-size:18px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block}
.hero{margin:8px 14px;padding:16px;border-radius:22px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.hero small{opacity:.85}.hero b{display:block;font-size:34px;margin:2px 0 8px}
.row{display:flex;gap:8px}.chip{flex:1;background:#ffffff26;border-radius:12px;padding:8px;font-size:12px}.chip b{font-size:15px;margin:0}
.sell{margin:10px 14px;padding:18px;border-radius:20px;background:var(--accent);color:var(--onaccent);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px}
.tile{background:var(--surface);border-radius:18px;padding:14px;font-size:14px;font-weight:600;position:relative;box-shadow:0 1px 3px #0001}
.tile i{display:block;width:34px;height:34px;border-radius:11px;margin-bottom:8px}
.badge{position:absolute;top:10px;right:10px;background:var(--warn);color:#2b1c00;border-radius:10px;padding:2px 8px;font-size:12px}
.pal{display:flex;margin-top:8px;border-radius:10px;overflow:hidden;height:34px}.pal span{flex:1;font-size:9px;color:#fff;display:flex;align-items:end;padding:2px}
.A{--p1:#1E6FF2;--p2:#1257C9;--accent:#18C29C;--onaccent:#fff;--ok:#18C29C;--warn:#F5A524;--danger:#F0566A}
.A.l{--bg:#F3F8FF;--surface:#fff;--text:#0F2038}
.A.d{--bg:#0A1424;--surface:#14233A;--text:#E8F0FF;--p1:#2F7BFF;--p2:#1B4FB8;--accent:#2FD9B2;--onaccent:#04241C}
.B{--p1:#3D5AFE;--p2:#2A3FC4;--accent:#FFC63D;--onaccent:#2B2000;--ok:#22C55E;--warn:#FF8A3D;--danger:#F0566A}
.B.l{--bg:#F6F7FF;--surface:#fff;--text:#14183A}
.B.d{--bg:#0D1024;--surface:#191E3F;--text:#ECEEFF;--p1:#5873FF;--p2:#3347C9;--accent:#FFD25E}
</style>
<script>
function phone(cls,name,pal){document.write(`<div class="col"><h2>${name}</h2><div class="phone ${cls}"><div class="bar"><span>Tindahan ni Rosa</span><span class="dot"></span></div>
<div class="hero"><small>Benta ngayon</small><b>₱1,240.00</b><div class="row"><div class="chip"><small>Cash</small><b>₱980</b></div><div class="chip"><small>GCash</small><b>₱260</b></div><div class="chip"><small>Utang</small><b>₱0</b></div></div></div>
<div class="sell">🧾 Magbenta</div>
<div class="grid"><div class="tile"><i style="background:var(--p1)"></i>Utang</div><div class="tile"><i style="background:var(--accent)"></i>Stock<span class="badge">3 paubos</span></div><div class="tile"><i style="background:var(--p2)"></i>Mga Produkto</div><div class="tile"><i style="background:var(--danger)"></i>Ulat</div></div>
<div style="padding:14px"><div class="pal">${pal.map(c=>`<span style="background:${c}"></span>`).join('')}</div></div></div></div>`)}
const A=['#1E6FF2','#1257C9','#18C29C','#F5A524','#F0566A'],B=['#3D5AFE','#2A3FC4','#FFC63D','#FF8A3D','#F0566A'];
phone('A l','A Fresh Tide, light',A);phone('A d','A Fresh Tide, dark',A);phone('B l','B Golden Indigo, light',B);phone('B d','B Golden Indigo, dark',B);
</script>
