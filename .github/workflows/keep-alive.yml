name: keep-alive

on:
  schedule:
    # Run every 3 days at 00:00 UTC to prevent Supabase 7-day idle pause
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase health RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secret is not set. Skipping keep-alive ping."
            exit 0
          fi
          URL="${SUPABASE_URL%/}/rest/v1/rpc/health_ping"
          RESP_FILE="/tmp/health_ping_response.json"
          case "$SUPABASE_SERVICE_ROLE_KEY" in
            sb_secret_*)
              HTTP_CODE=$(curl -sS -o "$RESP_FILE" -w '%{http_code}' -X POST "$URL" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" \
                -d '{}')
              ;;
            *)
              HTTP_CODE=$(curl -sS -o "$RESP_FILE" -w '%{http_code}' -X POST "$URL" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" \
                -d '{}')
              ;;
          esac
          RESPONSE=$(cat "$RESP_FILE" 2>/dev/null || true)
          echo "HTTP $HTTP_CODE"
          echo "Response: $RESPONSE"
          if [ "$HTTP_CODE" = "200" ] && printf '%s' "$RESPONSE" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
            echo "Health ping succeeded!"
          else
            echo "Health ping failed (expected HTTP 200 and ok: true)"
            exit 1
          fi
