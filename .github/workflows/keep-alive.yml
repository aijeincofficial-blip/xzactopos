name: keep-alive

on:
  schedule:
    # Run every 3 days at 00:00 UTC to prevent Supabase 7-day idle pause
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase health RPC
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL secret is not set. Skipping keep-alive ping."
            exit 0
          fi
          RESPONSE=$(curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/health_ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Health ping succeeded!"
          else
            echo "Health ping did not return ok:true"
            exit 1
          fi
