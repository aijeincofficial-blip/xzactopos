name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: cd apps/mobile && flutter pub get

      # Start only what pgTAP needs to keep CI fast.
      - name: Start local Supabase
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,studio,mailpit,postgres-meta

      # lint, typecheck, unit tests, pgTAP
      - run: pnpm check

      - name: Build client
        run: pnpm build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
