name: backup

on:
  schedule:
    # Run weekly on Sundays at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run pg_dump
        run: |
          if [ -z "${{ secrets.DB_URL }}" ]; then
            echo "DB_URL secret is not set. Skipping backup."
            exit 0
          fi
          mkdir -p backups
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%SZ)
          pg_dump "${{ secrets.DB_URL }}" --clean --if-exists --no-owner --no-privileges | gzip > "backups/backup_${TIMESTAMP}.sql.gz"
          echo "Backup created: backups/backup_${TIMESTAMP}.sql.gz"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: backups/*.sql.gz
          retention-days: 30
